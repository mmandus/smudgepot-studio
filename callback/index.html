<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smudge Pot Uploader: sign-in</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.6;color:#1a1a1a;background:#fff}code{word-break:break-all;background:#f2f2f2;padding:2px 4px}@media (prefers-color-scheme:dark){body{background:#111;color:#e6e6e6}code{background:#222}}</style></head><body>
<h1>Smudge Pot Uploader</h1>
<p id="msg">Finishing sign-in…</p>
<script>
// TikTok sends the browser here with ?code=…&state=…. This page passes them on to the uploader
// running on this same computer (http://localhost:3455/callback/). Nothing is stored or sent anywhere else.
const q = new URLSearchParams(location.search), code = q.get("code"), state = q.get("state"), err = q.get("error");
const msg = document.getElementById("msg");
if (err) { msg.textContent = "TikTok returned an error: " + err + " " + (q.get("error_description") || ""); }
else if (code) {
  msg.innerHTML = "Handing the sign-in to the uploader on this computer… If nothing happens, make sure <code>tiktok.py login</code> is running.";
  location.replace("http://localhost:3455/callback/?" + new URLSearchParams({code, state: state || ""}).toString());
} else { msg.textContent = "This page is only used during Smudge Pot Uploader sign-in."; }
</script>
</body></html>
